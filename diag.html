<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diagnóstico de tema</title>
<style>
  body{margin:0;padding:16px;font:15px/1.4 system-ui,sans-serif;background:#fff;color:#111}
  h1{font-size:20px;margin:0 0 6px} p{margin:0 0 14px;color:#444}
  .box{margin:0 0 14px} .box b{display:block;margin-bottom:4px}
  iframe{width:100%;height:150px;border:1px solid #bbb;border-radius:10px;background:#fff}
</style></head><body>
<h1>Diagnóstico de tema</h1>
<p>Sacá una captura de esta pantalla (deslizá para ver los 4 recuadros) y mandásela a Claude. Cada recuadro es una página aparte con una declaración distinta de color. Los que deberían verse <b>crema claro</b> son A, B y C; D es el oscuro a propósito.</p>
<div id="boxes"></div>
<p id="info" style="font-size:13px;color:#555"></p>
<script>
const body = (extra, css, bg, fg, btn) => `<!doctype html><html><head><meta charset="utf-8">${extra}
<style>html{${css}} body{margin:0;padding:14px;background:${bg};color:${fg};font:16px system-ui,sans-serif}
button{margin-top:8px;padding:10px 16px;border:0;border-radius:12px;background:${btn[0]};color:${btn[1]};font:600 15px system-ui}
.c{margin-top:10px;padding:10px;border-radius:12px;background:${btn[2]}}</style></head>
<body><b style="font:600 22px Georgia,serif">$ 134.000</b><div class="c">Tarjeta de ejemplo</div><button>Anotar</button></body></html>`;
const light = ['#2c3e6b', '#f7f3e8', '#fbf8f0'];
const V = [
  ['A · sin declarar nada', body('', '', '#f4f0e6', '#1d1b16', light)],
  ['B · "solo claro" (lo que usé antes)', body('<meta name="color-scheme" content="only light">', 'color-scheme:only light', '#f4f0e6', '#1d1b16', light)],
  ['C · "light dark" con colores claros pintados a mano (la solución nueva)', body('<meta name="color-scheme" content="light dark">', 'color-scheme:light dark', '#f4f0e6', '#1d1b16', light)],
  ['D · oscuro de verdad', body('<meta name="color-scheme" content="dark">', 'color-scheme:dark', '#15140f', '#efe9d9', ['#a3b3e0', '#141a2e', '#1e1c16'])]
];
const wrap = document.getElementById('boxes');
V.forEach(([t, html]) => { const d = document.createElement('div'); d.className = 'box'; d.innerHTML = '<b></b>'; d.firstChild.textContent = t; const f = document.createElement('iframe'); f.srcdoc = html; d.appendChild(f); wrap.appendChild(d); });
document.getElementById('info').textContent = 'Navegador: ' + navigator.userAgent + ' · el sistema pide oscuro: ' + matchMedia('(prefers-color-scheme: dark)').matches + ' · app instalada: ' + matchMedia('(display-mode: standalone)').matches;
</script></body></html>
