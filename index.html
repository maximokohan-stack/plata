<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f4f0e6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15140f" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Plata">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<script>try{var t=localStorage.getItem('plata.theme');if(t==='light'||t==='dark'){var cs=t==='light'?'light dark':'dark';document.documentElement.setAttribute('data-theme',t);document.documentElement.style.colorScheme=cs;var m=document.querySelector('meta[name=color-scheme]');if(m)m.content=cs}}catch(e){}</script>
<link rel="stylesheet" href="styles.css">
<title>Plata</title>
</head>
<body>
<header class="top">
  <div><p class="sub" id="sub"></p><h1 id="title">Inicio</h1></div>
  <span class="top-actions">
  <button class="icon-btn ai-only" data-act="chat" aria-label="Asistente">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8zM19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg>
  </button>
  <button class="icon-btn" data-act="settings" aria-label="Ajustes y backup">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
  </button>
  </span>
</header>

<main id="main"></main>

<nav class="tabs" id="tabs">
  <button data-act="tab" data-v="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 10v10h14V10"/></svg><span>Inicio</span></button>
  <button data-act="tab" data-v="debts"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/></svg><span>Deudas</span></button>
  <button class="add-center" data-act="addtx" aria-label="Anotar un gasto o ingreso"><span class="plus"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></span><span class="add-label">Anotar</span></button>
  <button data-act="tab" data-v="split"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6"/></svg><span>Dividir</span></button>
  <button data-act="tab" data-v="groups"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.5-3.5 3-5.5 6.5-5.5s6 2 6.5 5.5M16 4.8a3.5 3.5 0 0 1 0 6.4M18 14.8c2 .6 3.3 2.2 3.5 5.2"/></svg><span>Grupos</span></button>
</nav>

<div id="overlay" class="overlay" hidden>
  <div class="sheet" role="dialog" aria-modal="true">
    <div class="sheet-head"><h2 id="sheet-title"></h2><button class="icon-btn" data-act="close" aria-label="Cerrar">✕</button></div>
    <div id="sheet-body"></div>
  </div>
</div>
<section id="chat" class="chat" hidden aria-label="Asistente">
  <div class="chat-head"><button class="icon-btn" data-act="chatclose" aria-label="Volver">‹</button><b>Asistente</b>
    <span class="top-actions"><button class="icon-btn" data-act="chatclear" aria-label="Nueva conversación">↺</button><button class="icon-btn" data-act="cfg" aria-label="Configurar">⚙</button></span></div>
  <div id="chat-log" class="chat-log"></div>
  <form id="chat-form" class="chat-form"><input id="chat-input" type="text" placeholder="Escribí o dictá…" autocomplete="off" enterkeyhint="send"><button id="chat-send" class="btn">Enviar</button></form>
</section>
<div id="update" class="update" hidden role="status"><span>Hay una versión nueva de Plata.</span><button class="btn sm" data-act="reload">Actualizar</button></div>
<div id="toast" class="toast" hidden></div>

<script src="app.js"></script>
<script src="llm.js"></script>
<script src="assistant.js"></script>
<script src="calc.js"></script>
<script src="items.js"></script>
<script src="import.js"></script>
</body>
</html>
